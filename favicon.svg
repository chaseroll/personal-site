<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .bg { fill: #111; }
    .fg { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #e8e8e8; }
      .fg { fill: #0a0a0a; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <text class="fg"
        x="50%" y="55%"
        dominant-baseline="middle"
        text-anchor="middle"
        font-family="ui-serif, 'New York', Charter, Georgia, 'Tiempos Text', Cambria, 'Times New Roman', Times, serif"
        font-size="22"
        font-weight="400"
        letter-spacing="-0.02em">C</text>
</svg>
