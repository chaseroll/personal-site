  <div class="article-band">
    <div class="band-inner">

      <form class="gate" autocomplete="off">
        <div class="gate-row">
          <input class="gate-input" type="password" name="password" placeholder="Password" aria-label="Password" aria-describedby="gate-err" />
          <button class="gate-go" type="submit" aria-label="Unlock">&rarr;</button>
        </div>
        <p class="gate-err" id="gate-err" role="alert" hidden>That&rsquo;s not it.</p>
      </form>

        <div class="year-group">
          <h2 class="notes-year">2026</h2>
          <div class="notes-list">
            <a href="/notes/by-invitation-only/">By Invitation Only</a>
            <a href="/notes/hello-world/">Hello, world</a>
          </div>
        </div>

    </div>

    </div>

  <script>
  (function () {
    var form = document.querySelector('.gate');
    if (!form) return;
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = form.password.value;
      if (!v || !window.crypto || !crypto.subtle) return;
      crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function (buf) {
        var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
        if (hex === '61f5e53847298f22168f1966996cd0939683ce2bd69abda73c9e2f8d3e5895af') {
          try { localStorage.setItem('chaseroll-notes', hex); } catch (err) {}
          document.documentElement.removeAttribute('data-locked');
          var first = document.querySelector('.notes-list a');
          if (first) first.focus(); /* land keyboard/SR focus on the revealed list */
        } else {
          form.querySelector('.gate-err').hidden = false;
          form.password.value = '';
          form.password.focus();
        }
      });
    });
  })();
  </script>
